databases:
  - name: agronexus-db
    plan: free
    region: singapore
    databaseName: agronexus
    user: agronexus

services:
  # ---------------- backend API ----------------
  - type: web
    name: agronexus-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agronexus-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: https://agronexus-web.onrender.com
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: RUN_NETWORK_PROBE
        value: "1"

  # ---------------- Angular frontend ----------------
  - type: web
    name: agronexus-web
    runtime: static
    buildCommand: cd frontend && npm ci && npx ng build
    staticPublishPath: frontend/dist/frontend/browser
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin